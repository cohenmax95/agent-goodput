name: Bug report
description: Report a reproducible defect using synthetic or sanitized data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, model outputs, credentials, private project
        paths, customer data, or proprietary benchmark fixtures.
  - type: input
    id: version
    attributes:
      label: Agent Goodput version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex version
      description: Run `codex --version`.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Classification or routing
        - Context or deterministic prework
        - Benchmark or evaluator
        - Controller or evidence ledger
        - Hook or installer
        - Token or response-cycle accounting
        - Documentation or site
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give the smallest reproduction that contains no private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, raw answers, credentials, private paths, customer data, and proprietary fixtures.
          required: true
