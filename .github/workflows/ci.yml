name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: python -m build
      - name: Validate plugin JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool hooks/hooks.json >/dev/null
          python -m json.tool config/default-policy.json >/dev/null
          python -m json.tool benchmarks/manifests/codex-smoke-v1.json >/dev/null
          python -m json.tool benchmarks/manifests/codex-full-v1.json >/dev/null
          python -m json.tool benchmarks/manifests/codex-confirmatory-v1.json >/dev/null
          python -m json.tool benchmarks/manifests/codex-confirmatory-v2.json >/dev/null
          python -m json.tool benchmarks/schemas/evidence-answer.schema.json >/dev/null
